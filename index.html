const z=n=>String(n).padStart(2,'0'),cm=n=>String(n).replace('.',','),rp=n=>'Rp'+n.toLocaleString('id-ID'),gcd=(a,b)=>b?gcd(b,a%b):a;
const M={

function csvp(t){t=t.replace(/^\ufeff/,'');const h0=t.split('\n')[0],d=[';','\t',','].map(c=>[c,h0.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let r=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==d){r.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}if(f||r.length){r.push(f);rows.push(r)}const h=rows.shift().map(x=>x.trim().toLowerCase());return rows.filter(a=>a.some(x=>x.trim())).map(a=>Object.fromEntries(h.map((k,i)=>[k,a[i]||''])))}
function r2q(rows){const Q=[],er=[];rows.forEach((o,i)=>{const g=k=>String(o[k]??'').trim(),n=i+2,t=g('tipe').toLowerCase()||'pg',q=g('soal');if(!q)return er.push(`Baris ${n}: soal kosong`);if(!['pg','pgk','isi','sv'].includes(t))return er.push(`Baris ${n}: tipe harus pg, pgk, atau isi`);let st=g('stimulus'),op=null,k;if(st&&!/</.test(st))st='<p>'+esc(st)+'</p>';if(t=='sv'){op=['a','b','c','d','e'].map(g).filter(Boolean);if(op.length<2)op=['Sangat Tidak Setuju','Tidak Setuju','Setuju','Sangat Setuju'];k=null}else if(t=='isi'){k=g('kunci');if(!k)return er.push(`Baris ${n}: kunci kosong`)}else{op=['a','b','c','d','e'].map(g).filter(Boolean);if(op.length<2)return er.push(`Baris ${n}: minimal 2 pilihan`);const ks=g('kunci').toUpperCase().split(/[^A-E]+/).filter(Boolean).map(x=>x.charCodeAt(0)-65);if(!ks.length||ks.some(x=>x>=op.length)||(t=='pg'&&ks.length>1))return er.push(`Baris ${n}: kunci tidak valid`);k=t=='pg'?ks[0]:[...new Set(ks)].sort((a,b)=>a-b)}Q.push({s:/mat/i.test(g('mapel'))?'MAT':'BIN',c:g('kompetensi')||'Umum',l:Math.min(5,Math.max(1,+g('level')||2)),t,st:st||null,q,o:op,k,e:g('pembahasan')||'-'})});return{Q,er}}

function upl(f){if(!f)return;const rd=new FileReader(),x=/\.xlsx?$/i.test(f.name),lc=o=>Object.fromEntries(Object.entries(o).map(([k,v])=>[k.trim().toLowerCase(),v]));rd.onload=()=>{try{let rows;if(x){const w=XLSX.read(rd.result,{type:'array'});rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:''})}else{const t=rd.result;rows=/^\s*\[/.test(t)?JSON.parse(t):csvp(t)}prv(rows.map(lc))}catch(e){$('#up').innerHTML='<p class=er>File tidak dapat dibaca: '+esc(e.message||e)+'</p>'}};x?rd.readAsArrayBuffer(f):rd.readAsText(f)}

user:()=>{const U=D('tka_usr',[]);return `<div class=card><h3>Kelola User</h3><p class=mu>Operator memakai password utama (Pengaturan Lanjut). Tambahkan akun guru untuk masuk ke dashboard ini:</p><div class=r2><input id=un class=in placeholder="Nama guru"><input id=up2 class=in placeholder="Password (min 6)"></div><button class="b p" onclick=au()>Tambah</button><div class=tw><table><tr><th>Nama</th><th></th></tr>${U.map((u,i)=>`<tr><td>${esc(u.n)}</td><td><button class=b onclick="dl('tka_usr',${i})">Hapus</button></td></tr>`).join('')}</table></div></div>`},

butir:()=>{const sj=S.bs||'MAT',R=D('tka_res',[]).filter(r=>r.sj==sj&&(r.bv||'default')==bid()),Q=sq(sj),sel=`<div class=card><label>Mata pelajaran<select class=in onchange="S.bs=this.value;gr()"><option value=MAT ${sj=='MAT'?'selected':''}>${MP().MAT.n}</option><option value=BIN ${sj=='BIN'?'selected':''}>${MP().BIN.n}</option></select></label></div>`;if(!R.length)return sel+'<div class=card><p class=mu>Belum ada hasil untuk bank soal aktif.</p></div>';const o=R.slice().sort((a,b)=>b.tot-a.tot),n=Math.max(1,Math.round(R.length*.27)),U=o.slice(0,n),W=o.slice(-n),pc=(L,i,q)=>L.filter(r=>ok(q,r.a[i])).length/L.length;return sel+`<div class=card><h3>Analisis Butir Soal (${R.length} peserta)</h3><div class=tw><table><tr><th>No</th><th>Kompetensi</th><th>Level</th><th>% Benar</th><th>Kesukaran</th><th>Daya Beda</th><th>Catatan</th></tr>${Q.map((q,i)=>{if(q.t=='sv')return'';const p=pc(R,i,q),d=pc(U,i,q)-pc(W,i,q);return `<tr><td>${i+1}</td><td>${esc(q.c)}</td><td>${LV[q.l]}</td><td>${Math.round(p*100)}%</td><td>${p>=.7?'Mudah':p>=.3?'Sedang':'Sulit'}</td><td>${d.toFixed(2).replace('.',',')}</td><td>${d<.2?'Perlu ditinjau':d<.4?'Cukup':'Baik'}</td></tr>`}).join('')}</table></div><p class=mu>Daya beda = % benar kelompok atas (27%) − kelompok bawah (27%). Bermakna bila peserta cukup banyak.</p></div>`},
kartu:()=>{const L=D('tka_sis',[]).filter(x=>!S.kf||x.kelas==S.kf);return `${kf()}<div class=card><button class="b p" onclick=kt()>Buat Token untuk Siswa Tanpa Token</button><button class=b onclick=print()>Cetak Kartu</button></div><div class=kg>${L.map(x=>`<div class=kd><b>${esc(sk().n)}</b><br><small>KARTU PESERTA TRY OUT TKA</small><hr>Nama: <b>${esc(x.nama)}</b><br>NIS: ${esc(x.nis)}<br>Kelas / Absen: ${esc(x.kelas)} / ${esc(x.absen)}<br>Token: <b>${x.tk||'-'}</b></div>`).join('')}</div>`},
sek:()=>{const s=sk();return `<div class=card><h3>Pengaturan Sekolah</h3>${[['n','Nama Sekolah'],['npsn','NPSN'],['al','Alamat'],['kp','Kepala Sekolah'],['nip','NIP Kepala Sekolah'],['ta','Tahun Ajaran']].map(([k,l])=>`<label>${l}<input class=in id=sk_${k} value="${esc(s[k]||'')}"></label>`).join('')}<button class="b p" onclick=ssk()>Simpan</button></div>`},
lanjut:()=>`<div class=card><h3>Pengaturan Lanjut</h3><label>Ganti password operator (min 6 karakter)<input id=np class=in></label><button class=b onclick="if($('#np').value.length>=6){St.pw=$('#np').value;sv2();ask('Password diganti.',()=>{})}">Simpan</button></div><div class=card><h3>Cadangan Data</h3><p class=mu>Data tersimpan di browser perangkat ini. Salin cadangan untuk dipindahkan ke perangkat lain; simpan di tempat aman karena memuat password.</p><button class=b onclick=bk1()>Buat Cadangan</button><button class=b onclick=bk2()>Pulihkan dari Kotak</button><textarea id=bkx style="display:block;height:120px"></textarea></div><div class=card><button class=b onclick="ask('Hapus SEMUA hasil dan token?',()=>{LS('tka_res',[]);LS('tka_tok',[]);gr()})">Reset Hasil &amp; Token</button></div>`};
function gr(m){if(m)S.m=m;m=S.m||'dash';app(`<header class=hd><b>Admin · TKA UPT SD Negeri Beji 1</b><button class=lk onclick=home()>Keluar</button></header><div class=ad><nav class=sb>${MN.map(([k,n])=>`<button class="nv ${k==m?'on':''}" onclick="gr('${k}')">${n}</button>`).join('')}</nav><main class=wrap style="flex:1;min-width:0;width:100%">${GM[m]()}</main></div>`)}
function svm(){const M=MP();for(const k in M)M[k]={n:$('#mn'+k).value||k,d:+$('#md'+k).value||90,on:$('#mo'+k).checked?1:0};St.mp=M;sv2();ask('Tersimpan.',()=>{})}
function ak(){const v=$('#kn').value.trim();if(!v)return;const K=D('tka_kls',[]);if(!K.includes(v))K.push(v);LS('tka_kls',K);gr()}
function dl(k,i){ask('Hapus data ini?',()=>{const a=D(k,[]);a.splice(i,1);LS(k,a);gr()})}
function dr(id){ask('Hapus hasil ini?',()=>{LS('tka_res',D('tka_res',[]).filter(x=>x.id!=id));gr()})}
function adS(o){const L=D('tka_sis',[]),K=D('tka_kls',[]);if(!o.nama||!o.kelas)return;L.push({nis:o.nis||'',nama:o.nama.trim(),kelas:o.kelas.trim(),absen:o.absen||''});if(!K.includes(o.kelas.trim())){K.push(o.kelas.trim());LS('tka_kls',K)}LS('tka_sis',L)}
function as1(){adS({nis:$('#si_n').value,nama:$('#si_m').value,kelas:$('#si_k').value,absen:$('#si_a').value});gr()}
function as2(){$('#sbk').value.split('\n').forEach(l=>{const a=l.split(/[;\t,]/).map(x=>x.trim());adS({nis:a[0],nama:a[1]||'',kelas:a[2]||'',absen:a[3]})});gr()}
function au(){const n=$('#un').value.trim(),p=$('#up2').value;if(!n||p.length<6)return ask('Isi nama dan password (min 6 karakter).',()=>{});const U=D('tka_usr',[]);U.push({n,p});LS('tka_usr',U);gr()}
function kt(){const L=D('tka_sis',[]),T=D('tka_tok',[]),ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';L.forEach(x=>{if(!x.tk){let t;do{t='';for(let j=0;j<6;j++)t+=ch[Math.floor(Math.random()*ch.length)]}while(T.some(y=>y.t==t));x.tk=t;T.push({t,u:''})}});LS('tka_sis',L);LS('tka_tok',T);gr()}
function ssk(){const s={};['n','npsn','al','kp','nip','ta'].forEach(k=>s[k]=$('#sk_'+k).value);St.sk=s;sv2();ask('Tersimpan.',()=>{})}
function bk1(){const o={};['tka_res','tka_tok','tka_sis','tka_kls','tka_usr','tka_set','tka_bank'].forEach(k=>o[k]=LS(k));$('#bkx').value=JSON.stringify(o)}
function bk2(){try{const o=JSON.parse($('#bkx').value);Object.entries(o).forEach(([k,v])=>{if(k.startsWith('tka_')&&v!=null)LS(k,v)});ask('Dipulihkan. Halaman akan dimuat ulang.',()=>location.reload())}catch(e){ask('Format cadangan tidak valid.',()=>{})}}
function gen(){const T=LS('tka_tok')||[],ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';for(let i=0;i<Math.min(+$('#nt').value||1,200);i++){let t='';for(let j=0;j<6;j++)t+=ch[Math.floor(Math.random()*ch.length)];T.push({t,u:''})}LS('tka_tok',T);gr()}
function exp(){const R=LS('tka_res')||[],cn=[...CN.I,...CN.M],q=x=>'"'+String(x).replace(/"/g,'""')+'"',rows=[['Nama','Kelas','Absen','Mapel','Waktu','Durasi(mnt)','Nilai BIN','Nilai MAT','Nilai Total',...cn.map(k=>'%'+k),'Rata Survei','Survei Per Butir']];
R.forEach(r=>rows.push([r.nm,r.kl,r.ab,r.sj=='MAT'?'Matematika':'Bahasa Indonesia',r.ts,r.dur,r.bi,r.mt,r.tot,...cn.map(k=>r.cp[k]?Math.round(r.cp[k][0]/r.cp[k][1]*100):''),(v=>v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(2).replace('.',','):'')((r.sv||[]).filter(Boolean)),(r.sv||[]).join('-')]));
const t=rows.map(a=>a.map(q).join(';')).join('\n');$('#cs').style.display='block';$('#cs').value=t;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='hasil_tka.csv';a.click()}catch(e){}}
function cp2(){const e=$('#cs');if(!e.value)exp();e.select();try{navigator.clipboard.writeText(e.value)}catch(x){document.execCommand('copy')}}
splash();
</script></body></html>
